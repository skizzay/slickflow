# Fresh, uniquely named test project only. No shared services or host ports on DB.
services:
  db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_PASSWORD: ${SLICKFLOW_FIXTURE_PASSWORD:?required}
    command: [postgres, -c, 'hba_file=/fixture/pg_hba.conf']
    volumes:
      - database:/var/lib/postgresql
      - ${SLICKFLOW_FIXTURE_DIR:?required}:/fixture:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 1s
      timeout: 3s
      retries: 60
  migration:
    image: ${SLICKFLOW_MIGRATION_IMAGE:?required}
    environment:
      SLICKFLOW_DB_URL: jdbc:postgresql://db:5432/slickflow?currentSchema=slickflow
      SLICKFLOW_DB_USER: slickflow_migrator
      SLICKFLOW_DB_RUNTIME_ROLE: slickflow_runtime
      SLICKFLOW_DB_PASSWORD: ${SLICKFLOW_FIXTURE_PASSWORD:?required}
  runtime:
    image: ${SLICKFLOW_RUNTIME_IMAGE:?required}
    restart: unless-stopped
    environment:
      SLICKFLOW_DB_URL: jdbc:postgresql://db:5432/slickflow?currentSchema=slickflow
      SLICKFLOW_DB_USER: slickflow_runtime
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      JAVA_TOOL_OPTIONS: -Xmx512m
    command:
      - --slickflow.execution.enabled=false
      - --slickflow.execution.inbox.enabled=false
      - --slickflow.manual-approval.enabled=false
      - --slickflow.worker.enabled=false
      - --slickflow.github.webhook.enabled=false
    secrets:
      - source: runtime_password
        target: SLICKFLOW_DB_PASSWORD
    read_only: true
    tmpfs: [/tmp]
    ports: ['127.0.0.1::8080']
  tools:
    profiles: [tools]
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    entrypoint: []
    environment:
      PGSERVICEFILE: /fixture/pg_service.conf
      PGPASSWORD: ${SLICKFLOW_FIXTURE_PASSWORD:?required}
    volumes:
      - ../../scripts:/repo/scripts:ro
      - ${SLICKFLOW_FIXTURE_DIR:?required}:/fixture:ro
      - ${SLICKFLOW_FIXTURE_DIR:?required}/backups:/backups
secrets:
  runtime_password:
    file: ${SLICKFLOW_FIXTURE_DIR:?required}/runtime-password
volumes:
  database:
