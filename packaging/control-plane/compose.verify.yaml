# Disposable packaging verification only; never use against the shared service.
services:
  db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: ${SLICKFLOW_TEST_PASSWORD:?required}
      POSTGRES_DB: slickflow
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U migrator -d slickflow']
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - database:/var/lib/postgresql
  migration:
    image: ${SLICKFLOW_MIGRATION_IMAGE:?required}
    environment:
      SLICKFLOW_DB_URL: jdbc:postgresql://db:5432/slickflow?currentSchema=slickflow
      SLICKFLOW_DB_USER: migrator
      SLICKFLOW_DB_PASSWORD: ${SLICKFLOW_TEST_PASSWORD:?required}
    depends_on:
      db:
        condition: service_healthy
  runtime:
    image: ${SLICKFLOW_RUNTIME_IMAGE:?required}
    environment:
      SLICKFLOW_DB_URL: jdbc:postgresql://db:5432/slickflow?currentSchema=slickflow
      SLICKFLOW_DB_USER: runtime
      SLICKFLOW_DB_PASSWORD: ${SLICKFLOW_TEST_PASSWORD:?required}
      JAVA_TOOL_OPTIONS: -Xmx512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1::8080'
volumes:
  database:
