name: Control-plane artifacts

on:
  pull_request:
    branches: [main, 'epic/*']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Configuration boundaries
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Full PostgreSQL 18 regression suite
        env:
          COMPOSE_FILE: compose.yaml:packaging/control-plane/compose.regression18.yaml
        run: ./scripts/verify-bootstrap.sh
      - name: Native image build and smoke checks
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          ./scripts/package-control-plane.sh "$revision" "linux/$ARCH"
          export SLICKFLOW_RUNTIME_IMAGE=$(docker image inspect "slickflow-runtime:$revision-$ARCH" --format '{{.Id}}')
          export SLICKFLOW_MIGRATION_IMAGE=$(docker image inspect "slickflow-migration:$revision-$ARCH" --format '{{.Id}}')
          ./scripts/verify-packaging.sh
          ./scripts/verify-hosting.sh
          ./scripts/verify-hosting.sh --webhooks

  publish:
    name: Publish (${{ matrix.arch }})
    needs: [verify, publication-source]
    if: needs.publication-source.outputs.allowed == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify publication source and checkout
        run: ./scripts/publish-control-plane.sh --check-source
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and verify the actual publication pair
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          ./scripts/package-control-plane.sh "$revision" "linux/$ARCH"
          export SLICKFLOW_RUNTIME_IMAGE=$(docker image inspect "slickflow-runtime:$revision-$ARCH" --format '{{.Id}}')
          export SLICKFLOW_MIGRATION_IMAGE=$(docker image inspect "slickflow-migration:$revision-$ARCH" --format '{{.Id}}')
          ./scripts/verify-packaging.sh
          ./scripts/verify-hosting.sh
          ./scripts/verify-hosting.sh --webhooks
      - name: Authenticate publication only
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
      - name: Publish verified pair and record digests
        env:
          SLICKFLOW_PUBLISH_ARCH: ${{ matrix.arch }}
        run: ./scripts/publish-control-plane.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-plane-provenance-${{ matrix.arch }}-${{ github.run_attempt }}
          path: provenance-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove registry session
        if: always()
        run: docker logout ghcr.io

  publication-source:
    name: Check publication source
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    outputs:
      allowed: ${{ steps.source.outputs.allowed }}
    steps:
      - name: Check exact repository, ref and event
        id: source
        shell: bash
        run: |
          # GitHub Actions string comparisons are case-insensitive.
          if [[ "$GITHUB_REPOSITORY" == skizzay/slickflow && "$GITHUB_REF" == refs/heads/main &&
                ( "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
          fi
